version "3.4"

services:

web:
  build:  .
  container_name: php-web
  ports:
    - "8080:80"
  volumes:
    - ./www:/var/www/html
  depends_on:
    - mysql

mysql:
  image: mysql:8.4
  container_name: mysql-db
  restart: always

  environment:
    MYSQL_ROOT_PASSWORD: root
    MYSQL_DATABASE: sistema
    MYSQL_USER: usuario
    MYSQL_PASSWORD:senha

  ports:
  - "3306:3306"
  volumes:
  - mysql-data:/var/lib/mysql

phpmyadmin:
  image: phpmyadmin/phpmyadmin
  container_name: phpmyadmin
  restart: always
  ports:
    - "8080:80"
  environment:
    PMA_HOST: mysql
    MYSQL_ROOT_PASSWORD: root
  depends_on:
    - mysql
  
